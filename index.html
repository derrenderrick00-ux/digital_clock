<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock-card">
        <div class="clock-head"><h1>MODERN CLOCK</h1></div>
        <div class="clock-body">
            <div class="hours-output">00</div><div class="colon">:</div>
            <div class="minutes-output">00</div><div class="colon">:</div>
            <div class="seconds-output">00</div><div class="colon">:</div>
            <div class="miliseconds-output">00</div>
        </div>   
    </div>
    <script src="script.js"></script>
</body>
</html>
